<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>DeepSeek</title>
    <style>
      html, body { background-color: #ffffff; }
      html.dark, html.dark body { background-color: #16161a; }
    </style>
    <script>
      (function () {
        try {
          var keys = ['chat-demo:theme', 'chat-demo:theme-preference']
          var saved = null
          for (var i = 0; i < keys.length && !saved; i += 1) {
            saved = localStorage.getItem(keys[i])
          }
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) {
            document.documentElement.classList.add('dark')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#16161a')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- build: official recording card + persistent origin -->
  </body>
</html>
