name: Apply chat features

on:
  push:
    paths:
      - .github/workflows/apply-chat-features.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply chat UI source
        run: |
          curl -fsSL https://paste.rs/V2qLB > /tmp/chat-ui.b64
          curl -fsSL https://paste.rs/R9zF2 >> /tmp/chat-ui.b64
          curl -fsSL https://paste.rs/nH6He >> /tmp/chat-ui.b64
          base64 -d /tmp/chat-ui.b64 > /tmp/chat-ui.tgz
          tar -xzf /tmp/chat-ui.tgz -C .
          rm -f src/components/chatInput/VoiceButton.tsx src/components/chatInput/VoiceButton.module.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src ios rspack.config.ts
          if git diff --cached --quiet; then
            echo "Already applied"
          else
            git commit -m "Match official recording UI and persist session storage"
            git push
          fi