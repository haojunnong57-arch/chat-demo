name: Build DeepSeek Android

# 与 build-ios.yml 并行、互不影响：只打未签名 debug APK 并上传 artifact，
# 不发 release（避免与 iOS IPA 命名冲突）。

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          # runner 已自带 cmdline-tools；避免 setup-android@v3 默认安装已下架的 'tools' 包。
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack dist into WebView assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/

      - name: Build unsigned debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Android-3.2.1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error