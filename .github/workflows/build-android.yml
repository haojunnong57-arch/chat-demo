name: Build DeepSeek Android

# 与 build-ios.yml 并行、互不影响：打 debug APK，同时发到独立的 android tag，
# 这样用户可以直接下载，不用登录去翻 Actions 产物。

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: build-android-v350
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          # runner 已自带 cmdline-tools；避免 setup-android@v3 默认安装已下架的 'tools' 包。
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack dist into WebView assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/

      - name: Build unsigned debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/DeepSeek-Android-3.5-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Android-3.5-debug
          path: android/app/build/outputs/apk/debug/DeepSeek-Android-3.5-debug.apk
          if-no-files-found: error

      - name: Publish release (Android 付费激活版)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-android
          name: DeepSeek Android 3.5 · 付费激活版
          body: |
            DeepSeek Android 3.5（debug APK，arm64 / 通用）· 付费激活版

            安装后首次打开进入激活页：
            1. 在闲鱼购买后获取一串激活码；
            2. 填入激活码，验签通过后永久解锁；
            3. 已激活标记存本机，删装重装需重新填码。

            本轮更新：角色广场与角色设定、上下文占用面板、全局苹果 R 角与液态玻璃优化；
            修复安卓「按住说话」语音时好时坏的问题（麦克风运行时权限改为按需申请并补发授权）。
          files: android/app/build/outputs/apk/debug/DeepSeek-Android-3.5-debug.apk
          make_latest: false
