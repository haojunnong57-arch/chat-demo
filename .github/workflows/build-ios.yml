name: Build DeepSeek iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_run:
    workflows: ["Apply source patch"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ios/Resources/web
          mkdir -p ios/Resources/web
          cp -R dist/* ios/Resources/web/

      - name: Generate app icon
        run: |
          brew install librsvg
          mkdir -p ios/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 ios/Resources/AppIcon.svg \
            -o ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild \
            -project DeepSeek.xcodeproj \
            -scheme DeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/DeepSeek.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd ios
          rm -rf build/Payload build/DeepSeek-iOS-3.2.0-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/DeepSeek.xcarchive/Products/Applications/DeepSeek.app build/Payload/
          cd build
          zip -qr DeepSeek-iOS-3.2.0-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-iOS-3.2.0
          path: ios/build/DeepSeek-iOS-3.2.0-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          name: DeepSeek iOS 3.2.0 · 真液态玻璃 + 语义级流式渲染
          body: |
            DeepSeek iOS 3.2.0（未签名 IPA / arm64）

            - 接入 rdev/liquid-glass-react：输入区、弹层、菜单、抽屉统一为位移折射真玻璃，旧白色边框贴图已删除
            - 内容不足一屏时支持 iOS 橡皮筋拖拽，松手阻尼弹簧回位；超过一屏恢复原生滚动与边界回弹
            - 按住说话：实时蓝色波形与液态渐变，上滑切换红色取消态，按住立即停止 TTS
            - AI 回复按语义块成块浮现，液态尾部光标呼吸，长回答不重排；关闭增强动画或 Reduce Motion 自动降级
            - 新增“增强动画”开关；通透度滑块与真实 blurAmount / tint 实时联动

            未签名包，请使用 Sideloadly / AltStore 自签后安装。
          files: ios/build/DeepSeek-iOS-3.2.0-unsigned.ipa
          make_latest: true
