name: Build DeepSeek iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_run:
    workflows: ["Apply source patch"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ios/Resources/web
          mkdir -p ios/Resources/web
          cp -R dist/* ios/Resources/web/

      - name: Generate app icon
        run: |
          brew install librsvg
          mkdir -p ios/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 ios/Resources/AppIcon.svg \
            -o ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild \
            -project DeepSeek.xcodeproj \
            -scheme DeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/DeepSeek.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd ios
          rm -rf build/Payload build/DeepSeek-iOS-3.3.0-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/DeepSeek.xcarchive/Products/Applications/DeepSeek.app build/Payload/
          cd build
          zip -qr DeepSeek-iOS-3.3.0-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-iOS-3.3.0
          path: ios/build/DeepSeek-iOS-3.3.0-unsigned.ipa
          if-no-files-found: error

      - name: Publish release (付费激活版)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0
          name: DeepSeek iOS 3.3.0 · 付费激活版
          body: |
            DeepSeek iOS 3.3.0（未签名 IPA / arm64）· 付费激活版

            安装后首次打开进入激活页：
            1. 在闲鱼购买后获取一串激活码；
            2. 填入激活码，验签通过后永久解锁；
            3. 已激活标记存本机，删装重装需重新填码。

            未签名包，请使用 Sideloadly / AltStore 自签后安装。
          files: ios/build/DeepSeek-iOS-3.3.0-unsigned.ipa
          make_latest: true
