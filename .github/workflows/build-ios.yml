name: Build DeepSeek iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_run:
    workflows: ["Apply source patch"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ios/Resources/web
          mkdir -p ios/Resources/web
          cp -R dist/* ios/Resources/web/

      - name: Generate app icon
        run: |
          brew install librsvg
          mkdir -p ios/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 ios/Resources/AppIcon.svg \
            -o ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild \
            -project DeepSeek.xcodeproj \
            -scheme DeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/DeepSeek.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd ios
          rm -rf build/Payload build/DeepSeek-iOS-3.1.1-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/DeepSeek.xcarchive/Products/Applications/DeepSeek.app build/Payload/
          cd build
          zip -qr DeepSeek-iOS-3.1.1-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-iOS-3.1.1
          path: ios/build/DeepSeek-iOS-3.1.1-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.1
          name: DeepSeek iOS 3.1.1 · UI 细节与玻璃可读性修复
          body: |
            DeepSeek iOS 3.1.1（未签名 IPA / arm64）

            - 头像改为微信式常驻列，手机屏幕内完整可见，不再需要横向滑动
            - 聊天页标题栏新增「更多 → 删除」，不必回侧栏也能删除当前对话
            - 浅色模式补回极薄雾层，既保留照片层次又保证文字可读
            - 液态玻璃拉至最透明时保留细白边 + 薄白膜，输入框与文字仍然可读
            - 设置、菜单、抽屉等弹层统一为磨砂玻璃；通透度设置仅在液态玻璃主题显示

            未签名包，请使用 Sideloadly / AltStore 自签后安装。
          files: ios/build/DeepSeek-iOS-3.1.1-unsigned.ipa
          make_latest: true
