name: Build DeepSeek iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_run:
    workflows: ["Apply source patch"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ios/Resources/web
          mkdir -p ios/Resources/web
          cp -R dist/* ios/Resources/web/

      - name: Generate app icon
        run: |
          brew install librsvg
          mkdir -p ios/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 ios/Resources/AppIcon.svg \
            -o ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild \
            -project DeepSeek.xcodeproj \
            -scheme DeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/DeepSeek.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd ios
          rm -rf build/Payload build/DeepSeek-iOS-3.1.0-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/DeepSeek.xcarchive/Products/Applications/DeepSeek.app build/Payload/
          cd build
          zip -qr DeepSeek-iOS-3.1.0-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-iOS-3.1.0
          path: ios/build/DeepSeek-iOS-3.1.0-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: DeepSeek iOS 3.1.0 · UI 设计 + 交互动画优化版
          body: |
            DeepSeek iOS 3.1.0（未签名 IPA / arm64）

            - Instagram 皮肤文字与气泡改为多层径向渐变，去掉小尾巴拼接痕迹
            - 液态玻璃输入区改为真实透明材质（背景模糊 + 环境色 + 边缘高光），通透度可调
            - 弹层、菜单、抽屉加入可打断的 Spring 进场动画；胶囊到面板做 Fluid Morph
            - 卡片跟随触摸做 3D 透视倾斜与径向流光，松手 Spring 回正
            - 消息列表交错入场；按住说话立即打断 AI 播报
            - 支持自定义系统提示词（不追加任何内置说明）与双向头像（未设置则不显示）
            - 修复聊天背景浅色泛白、深色发黑的蒙层问题

            未签名包，请使用 Sideloadly / AltStore 自签后安装。
          files: ios/build/DeepSeek-iOS-3.1.0-unsigned.ipa
          make_latest: true
