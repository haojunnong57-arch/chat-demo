name: Build DeepSeek iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_run:
    workflows: ["Apply source patch"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ios/Resources/web
          mkdir -p ios/Resources/web
          cp -R dist/* ios/Resources/web/

      - name: Generate app icon
        run: |
          brew install librsvg
          mkdir -p ios/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 ios/Resources/AppIcon.svg \
            -o ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild \
            -project DeepSeek.xcodeproj \
            -scheme DeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/DeepSeek.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd ios
          rm -rf build/Payload build/DeepSeek-iOS-3.2.1-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/DeepSeek.xcarchive/Products/Applications/DeepSeek.app build/Payload/
          cd build
          zip -qr DeepSeek-iOS-3.2.1-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-iOS-3.2.1
          path: ios/build/DeepSeek-iOS-3.2.1-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.1
          name: DeepSeek iOS 3.2.1 · 菜单幽灵白圈修复
          body: |
            DeepSeek iOS 3.2.1（未签名 IPA / arm64）

            - 修复侧栏“更多”和聊天“更多”菜单里的幽灵白圈、白色胶囊边框与焦点高亮残留
            - 菜单层级提升并隔离底层悬浮控件；按压高亮和水波纹不再带入弹层
            - 保留真液态玻璃、橡皮筋回弹、按住说话红蓝态与语义块流式渲染

            未签名包，请使用 Sideloadly / AltStore 自签后安装。
          files: ios/build/DeepSeek-iOS-3.2.1-unsigned.ipa
          make_latest: true
