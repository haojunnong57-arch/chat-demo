name: Apply source patch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-source-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI + animation patch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/slVsJG6ejX" -o /tmp/ui-glass.tgz
          tar -xzf /tmp/ui-glass.tgz -C .
          rm -f /tmp/ui-glass.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src ios/Info.plist
          if git diff --cached --quiet; then
            echo "Already applied"
          else
            git commit -m "UI 3.1.1: avatar layout, readable glass, light fog, global frosted panels"
            git push
          fi
