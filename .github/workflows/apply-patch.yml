name: Apply source patch

# 一次性补丁流水线：从 CDN 取本轮源码补丁，校验 sha256 后应用到 main。
# 目的：远端只有单文件写入通道，整批改动用补丁一次落地，避免逐个文件覆盖。
# 应用完成后触发 iOS 与 Android 构建。
# v1：首次推送时 Actions 处于禁用状态，启用后靠本次提交重新触发。
# v2：角色广场移到设置内并改为全自定义（无内置角色、支持自定义头像），首页还原。

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify patch
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/Keic4kp4y0" -o /tmp/code.patch
          echo "47d03f8106fc2c98ea63e4e976cf07c7ee7ec09b473a36f72284a2b0721d5262  /tmp/code.patch" \
            | sha256sum -c -

      - name: Apply patch
        run: |
          git apply --check /tmp/code.patch
          git apply /tmp/code.patch

      - name: Commit and push
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "角色广场改为全自定义并移入设置：去掉内置角色、支持角色头像，首页还原"
          git push origin HEAD:main

      - name: Trigger builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ios.yml --ref main
          sleep 5
          gh workflow run build-android.yml --ref main
