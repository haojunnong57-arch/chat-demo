name: Apply source patch

# 一次性补丁流水线：从 CDN 取本轮源码补丁，校验 sha256 后应用到 main。
# 目的：远端只有单文件写入通道，整批改动用补丁一次落地，避免逐个文件覆盖。
# 应用完成后自动触发 iOS 构建；Android 构建由随后更新 build-android.yml 触发。
# v1：首次推送时 Actions 处于禁用状态，启用后靠本次提交重新触发。

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify patch
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/UYFPqGAz1m" -o /tmp/code.patch
          echo "30b85fba33bbbfba74f4095f72823a44a5c03e8fb46b5276a31ac558073c2a76  /tmp/code.patch" \
            | sha256sum -c -

      - name: Apply patch
        run: |
          git apply --check /tmp/code.patch
          git apply /tmp/code.patch

      - name: Commit and push
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "角色广场 + 角色设定 + 上下文占用面板 + 苹果 R 角/玻璃 + 安卓语音权限修复"
          git push origin HEAD:main

      - name: Trigger iOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ios.yml --ref main
