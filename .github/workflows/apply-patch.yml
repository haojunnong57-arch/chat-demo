name: Apply source patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fix i18n by regex
        run: python3 tools/fix4.py

      - name: Commit and push
        run: |
          git diff --stat
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "清理残缺的 i18n 行，背景按钮用字面文案"
          git push origin HEAD:main

      - name: Trigger builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ios.yml --ref main
          sleep 5
          gh workflow run build-android.yml --ref main
