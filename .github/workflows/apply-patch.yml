name: Apply source patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify patch
        run: |
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/Lez2l7O5gd" -o /tmp/code.patch
          echo "44be800041d41445ae22214b0f280e1011e8d9c6b5b7c1a3a98c392bd8191c4e  /tmp/code.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git apply --check /tmp/code.patch
          git apply /tmp/code.patch

      - name: Commit and push
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "输入区承托层改为顶部圆角，修键盘弹起后的方形白框"
          git push origin HEAD:main

      - name: Trigger builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ios.yml --ref main
          sleep 5
          gh workflow run build-android.yml --ref main
