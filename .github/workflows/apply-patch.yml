name: Apply source patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Motion gate + refraction + video frames + edge swipe
        run: |
          python3 tools/video2.py
          python3 tools/video3.py

      - name: Commit and push
        run: |
          git diff --stat
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "增强动画只管水波纹 + 折射可见 + 视频抽帧 + 左缘轻扫" || echo "no change"
          git push origin HEAD:main

      - name: Trigger builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ios.yml --ref main
          sleep 5
          gh workflow run build-android.yml --ref main
