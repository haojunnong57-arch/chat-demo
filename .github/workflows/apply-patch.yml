name: Apply source patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild patch from inline payload
        run: |
          echo '' | base64 -d > /tmp/code.patch
          head -3 /tmp/code.patch

      - name: Apply patch
        run: |
          git apply --check /tmp/code.patch
          git apply /tmp/code.patch

      - name: Commit and push
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "修复角色串味、新增两张默认背景预设、消除启动白闪"
          git push origin HEAD:main

      - name: Trigger builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ios.yml --ref main
          sleep 5
          gh workflow run build-android.yml --ref main
