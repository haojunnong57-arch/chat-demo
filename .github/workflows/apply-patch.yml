name: Apply source patch

# 一次性补丁流水线：从 CDN 取源码补丁，校验 sha256 后应用到 main，再触发 iOS/Android 构建。
# v3：深色模式白雾修复（玻璃底色改用深色变量）。

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify patch
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/rpxNVPeVlW" -o /tmp/code.patch
          echo "f97f2dda65832a2b274fb21f25a0baf72bc0839f3198ca8174d649cf5a749425  /tmp/code.patch" \
            | sha256sum -c -

      - name: Apply patch
        run: |
          git apply --check /tmp/code.patch
          git apply /tmp/code.patch

      - name: Commit and push
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "深色模式白雾修复：玻璃底色改为主题变量，新增第二张默认背景资源"
          git push origin HEAD:main

      - name: Trigger builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-ios.yml --ref main
          sleep 5
          gh workflow run build-android.yml --ref main
